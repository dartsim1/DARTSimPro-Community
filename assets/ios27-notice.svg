<svg xmlns="http://www.w3.org/2000/svg" width="900" height="84" viewBox="0 0 900 84" role="img" aria-label="Known issue: on iOS and iPadOS 27 the app closes right after launch. Fix 26.10.13 is in App Store review.">
  <rect x="2" y="2" width="896" height="80" rx="12" fill="#c62828" stroke="#ffcdd2" stroke-width="3">
    <animate attributeName="fill" values="#c62828;#ff5252;#c62828" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#ffffff" text-anchor="middle">
    <text x="450" y="38" font-size="24" font-weight="800">
      KNOWN ISSUE: iOS / iPadOS 27 — app closes right after launch
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="66" font-size="17" font-weight="600">Fix (version 26.10.13) is submitted to Apple and awaiting App Store review</text>
  </g>
</svg>
